services:
  agent-hub:
    image: python:3.11-slim
    container_name: agent-hub
    restart: unless-stopped
    ports:
      - "8050:8050"
    volumes:
      - /mnt/user/appdata/agent-swarm/data:/data
      # The application DIRECTORY, not hub.py alone. hub.py imports the
      # controller package, and a single-file mount gives the container no way
      # to see it. Everything the hub runs lives under app/ and is mounted as
      # one tree, so adding a module is a file copy rather than another mount
      # and another container recreate.
      - /mnt/user/appdata/agent-swarm/app:/app
    working_dir: /app
    command: >
      sh -c "pip install fastapi uvicorn pydantic &&
             uvicorn hub:app --host 0.0.0.0 --port 8050"
