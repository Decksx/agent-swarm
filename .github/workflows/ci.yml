name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pytest-unit:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pytest fastapi uvicorn pydantic requests httpx tzdata
      
      - name: Run pytest-unit
        run: |
          pytest tests/ -k "not bypass"
          pytest hub/

  pytest-bypass:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pytest fastapi uvicorn pydantic requests httpx tzdata
      
      - name: Run pytest-bypass
        run: pytest tests/ -k "bypass"
